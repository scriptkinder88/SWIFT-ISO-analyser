<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SWIFT ISO Analyser</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1>SWIFT ISO Analyser</h1>
    <div class="actions">
      <button id="btn-sync" type="button" title="Read component inventory from Wazuh agents">Sync Wazuh</button>
      <a id="btn-export" class="button" href="/api/report.pptx" download>Download PowerPoint</a>
    </div>
    <p id="message" class="message" role="status" aria-live="polite"></p>
  </header>

  <main class="layout">
    <aside class="sidebar" aria-label="Model and framework">
      <details class="library" open>
        <summary>Model explorer</summary>
        <input id="tree-search" type="search" placeholder="Filter components…" autocomplete="off" aria-label="Filter components">
        <div id="tree"></div>
      </details>
      <details class="library" open>
        <summary>Framework</summary>
        <p id="framework-meta" class="muted"></p>
        <div id="controls"></div>
      </details>
      <details class="library">
        <summary>Symbol library</summary>
        <div id="symbol-library"></div>
      </details>
    </aside>

    <section class="map-wrap" aria-label="Architecture diagram">
      <div class="map-tools" role="toolbar" aria-label="Diagram tools">
        <button type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in (+)">+</button>
        <button type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out (−)">−</button>
        <button type="button" id="zoom-fit" title="Fit diagram (F)">Fit</button>
        <span id="zoom-level" class="muted" aria-live="off">100%</span>
        <span class="layers" role="group" aria-label="Layers">
          <label><input type="checkbox" data-layer="zones" checked> Zones</label>
          <label><input type="checkbox" data-layer="linkLabels" checked> Link labels</label>
          <label><input type="checkbox" data-layer="grid" checked> Grid</label>
          <label><input type="checkbox" data-layer="badges" checked> Status</label>
        </span>
      </div>
      <svg id="map" role="img" aria-label="Architecture diagram"></svg>
      <div class="legend" id="legend" aria-label="Network type legend"></div>
    </section>

    <aside class="panel" id="panel" aria-label="Details">
      <label class="field">
        Auditor
        <input id="auditor" type="text" maxlength="120" placeholder="Name and surname" autocomplete="off">
      </label>
      <div id="detail"></div>
    </aside>
  </main>

  <script src="/symbols.js"></script>
  <script src="/app.js" defer></script>
</body>
</html>
